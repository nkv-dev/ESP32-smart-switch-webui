<!--
================================================================================
                    ESP32 SMART HOME - LOGIN PAGE
================================================================================

This is the login page. Users enter their email and password here.
On successful login, they're redirected to the main dashboard.

================================================================================
-->

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Smart Home</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <link rel="stylesheet" href="style.css">

  <style>
    /* Login page specific styles */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: #1e293b;
      padding: 40px;
      border-radius: 18px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .login-box h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .login-box p {
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #334155;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }

    .input-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      margin-top: 10px;
    }

    .error-msg {
      background: #dc2626;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>

</head>

<body>

  <div class="login-container">

    <div class="login-box">

      <!-- Title -->
      <h1>🏠 Smart Home</h1>
      <p>Enter your credentials to access the dashboard</p>

      <!-- Error message display -->
      <div id="errorMsg" class="error-msg"></div>

      <!-- Login Form -->
      <form id="loginForm">

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Login</button>

      </form>

    </div>

  </div>

  <!-- Firebase Config and Login Script -->
  <script>
    /*
    ================================================================================
                    LOGIN PAGE JAVASCRIPT
    ================================================================================

    What does this code do?
    1. Initialize Firebase with our config
    2. Listen for form submission
    3. Try to login with email/password
    4. On success: save login state and redirect to dashboard
    5. On failure: show error message

    ================================================================================
    */

    // =========================================================
    // STEP 1: FIREBASE CONFIGURATION
    // =========================================================
    // Same config as before - tells Firebase which project to use

    const firebaseConfig = {
      apiKey: "AIzaSyA2vHVbqH6EoMuO-iXDzlh0uYL2fF1tPgw",
      authDomain: "esp32-smart-home-switch-nh.firebaseapp.com",
      projectId: "esp32-smart-home-switch-nh"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);


    // =========================================================
    // STEP 2: GET FORM ELEMENTS
    // =========================================================
    // We need to "grab" the HTML elements so we can use them in JavaScript

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');


    // =========================================================
    // STEP 3: CHECK IF ALREADY LOGGED IN
    // =========================================================
    // If user is already logged in, send them directly to dashboard
    // This uses Firebase's "onAuthStateChanged" - it watches for login state

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        // User is already logged in
        // Redirect to dashboard (index.html)
        window.location.href = 'index.html';
      }
      // If no user (not logged in), stay on this page
    });


    // =========================================================
    // STEP 4: HANDLE LOGIN FORM SUBMISSION
    // =========================================================
    // When user clicks "Login" button, this code runs

    loginForm.addEventListener('submit', (e) => {
      // Prevent the form from actually submitting (page refresh)
      e.preventDefault();

      // Get the email and password the user typed
      const email = emailInput.value;
      const password = passwordInput.value;

      // Show loading state
      loginBtn.textContent = 'Logging in...';
      loginBtn.classList.add('loading');
      errorMsg.style.display = 'none';


      // =========================================================
      // STEP 5: ATTEMPT LOGIN WITH FIREBASE
      // =========================================================
      // Use Firebase Auth to verify the credentials

      firebase.auth().signInWithEmailAndPassword(email, password)

        // If login succeeds:
        .then((userCredential) => {
          // userCredential.user contains the logged-in user info

          console.log('Login successful!');
          console.log('User:', userCredential.user.email);

          // Redirect to dashboard
          window.location.href = 'index.html';
        })

        // If login fails:
        .catch((error) => {
          // Show error message to user
          console.log('Login error:', error.message);

          errorMsg.textContent = error.message;
          errorMsg.style.display = 'block';

          // Reset button
          loginBtn.textContent = 'Login';
          loginBtn.classList.remove('loading');
        });

    });

  </script>

</body>

</html>
